<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Visual Aids</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #111827;
      --panel-2: #162033;
      --border: #243047;
      --text: #e5edf8;
      --muted: #8fa1bf;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --sidebar-w: 268px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .sidebar-sub {
      margin-top: 4px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .nav-section {
      padding: 12px 10px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 4px 8px 8px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 10px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--panel-2);
      border-color: var(--border);
    }

    .nav-btn.active {
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .nav-item-title {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .nav-item-meta {
      display: block;
      margin-top: 3px;
      font-size: 0.73rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .sidebar-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .sidebar-footer a:hover {
      text-decoration: underline;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .topbar {
      height: 48px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .current-page {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open-raw {
      font-size: 0.78rem;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }

    .open-raw:hover {
      text-decoration: underline;
    }

    .frame-wrap {
      flex: 1;
      position: relative;
      background: var(--bg);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    @media (max-width: 720px) {
      .app {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .frame-wrap {
        height: 82vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Visual Aids Navigation">
      <div>
        <div class="sidebar-header">
          <div class="sidebar-title">Visual Aids</div>
          <div class="sidebar-sub">Interactive HTML Sandboxes</div>
        </div>
        <div class="nav-section">
          <div class="nav-label">Pages (1)</div>
          <ul class="nav-list" id="pageList"></ul>
        </div>
      </div>
      <div class="sidebar-footer">
        <span>Static GitHub Pages</span>
        <a id="directLink" href="2d_vector_space_transformation_visualizer.html" target="_blank" rel="noopener">Full tab</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="current-page" id="currentTitle">2D Vector Space Transformation Visualizer</div>
        <a class="open-raw" id="rawLink" href="2d_vector_space_transformation_visualizer.html" target="_blank" rel="noopener">Open standalone</a>
      </div>
      <div class="frame-wrap">
        <iframe id="viewerFrame" src="2d_vector_space_transformation_visualizer.html" title="Interactive Visual Aid"></iframe>
      </div>
    </main>
  </div>

  <script>
    // Add new entries here as you create more HTML files
    const PAGES = [
      {
        title: "2D Vector Space Transformation Visualizer",
        file: "2d_vector_space_transformation_visualizer.html"
      }
    ];

    const listEl = document.getElementById("pageList");
    const frameEl = document.getElementById("viewerFrame");
    const titleEl = document.getElementById("currentTitle");
    const rawLinkEl = document.getElementById("rawLink");
    const directLinkEl = document.getElementById("directLink");

    function selectPage(index) {
      const page = PAGES[index];
      if (!page) return;

      frameEl.src = page.file;
      titleEl.textContent = page.title;
      rawLinkEl.href = page.file;
      directLinkEl.href = page.file;

      document.querySelectorAll(".nav-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
    }

    PAGES.forEach((page, index) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-btn" + (index === 0 ? " active" : "");
      btn.innerHTML = `
        <span class="nav-item-title">${page.title}</span>
        <span class="nav-item-meta">${page.file}</span>
      `;
      btn.addEventListener("click", () => selectPage(index));
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  </script>
</body>
</html>
